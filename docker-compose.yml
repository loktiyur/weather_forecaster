# Development (infrastructure only; the app runs on the host):
#   docker compose up -d
#   poetry run uvicorn app.main:app --reload
#
# Full stack (API and web frontend in containers too):
#   docker compose --profile full up -d --build
#   open http://localhost:8080

services:
  # Cache for local development.
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    # Append-only file keeps the cache across restarts; the memory limit + LRU eviction
    # make Redis behave like a cache (drop least recently used keys) instead of failing writes.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Separate instance for integration tests: tests flush it, so it must never be the dev cache.
  redis-test:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    # No persistence at all: every start is empty.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL for local development. Data survives restarts in a volume.
  # The credentials are for this local container only; nothing else uses them.
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
      POSTGRES_DB: weather_app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: during its first start the image runs a temporary server on the Unix
      # socket only, so a check over TCP is healthy only once the real server is up.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "weather", "-d", "weather_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Separate instance for integration tests: tests empty it, so it must never be the dev database.
  db-test:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
      POSTGRES_DB: weather_app_test
    # In memory: every start is empty, and tests run faster without disk writes.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "weather", "-d", "weather_app_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API image (Dockerfile). Only started with the `full` profile.
  api:
    profiles: ["full"]
    build: .
    image: weather-forecaster-api:local
    ports:
      - "${API_PORT:-8000}:8000"   # API_PORT=8001 if the dev server already uses 8000
    # Optional .env for settings like GEOCODING_PROVIDER; `environment` below wins over it,
    # so a REDIS_URL or DATABASE_URL meant for the host (localhost) can never leak into the container.
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://weather:weather@db:5432/weather_app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  # The web frontend (frontend/Dockerfile): nginx serves the Vue app and proxies /api to `api`.
  # Only started with the `full` profile. Open http://localhost:8080
  web:
    profiles: ["full"]
    build: ./frontend
    image: weather-forecaster-web:local
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  db-data:
