# Serves the built Vue app and forwards API calls to the `api` container, so the browser
# sees one origin (no CORS). Runs as the unprivileged nginx user on port 8080.

# nginx gives every request an id ($request_id) and passes it to the API as X-Request-ID:
# the nginx line and the API's log lines of one request carry the same id.
log_format with_request_id '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                           '$request_time rid=$request_id';
access_log /var/log/nginx/access.log with_request_id;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Basic hardening for every response (repeated `add_header` in a location would drop these).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Backend: REST API, health checks and the API docs.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location ~ ^/(health|docs|redoc|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # nginx's own liveness check (does not depend on the API).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Built files have a content hash in their name: they never change, cache them for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: every other path returns index.html and Vue Router takes over.
    # index.html itself must not be cached, so a new release is picked up immediately.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
