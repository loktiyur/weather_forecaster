[project]
name = "weather-forecaster"
version = "0.2.0"
description = "Async REST API that shows the current weather and forecast for a city."
authors = [{ name = "Yurii Loktionov", email = "yurii.loktionov@proton.me" }]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi (>=0.143.2,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "geopy (>=2.5.0,<3.0.0)",
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "respx (>=0.23.1,<0.24.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "poethepoet (>=0.49.0,<0.50.0)",
]

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "ASYNC",   # async pitfalls (blocking calls in async code)
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# geopy ships without type hints
module = ["geopy", "geopy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# Used by `pytest --cov` (CI always runs it). Plain `pytest` skips coverage,
# so running a single test file is not failed by the 80 % gate.
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
skip_empty = true
show_missing = true

# Task runner: `poetry run poe <task>`, or `poe <task>` inside `eval $(poetry env activate)`.
[tool.poe.tasks]
format-code = { sequence = [
    { cmd = "ruff check --fix ." },
    { cmd = "ruff format ." },
], help = "Auto-fix lint issues and format all code (incl. Python blocks in Markdown)" }
lint = { cmd = "ruff check .", help = "Lint" }
format-check = { cmd = "ruff format --check .", help = "Check formatting without changing files" }
typecheck = { cmd = "mypy", help = "Static type checking (strict)" }
test = { cmd = "pytest", help = "Run tests; extra args are passed through, e.g. poe test -k geocode" }
test-cov = { cmd = "pytest -v --cov", help = "Run tests with the 80 % coverage gate" }
check = { sequence = ["lint", "format-check", "typecheck", "test-cov"], help = "Everything CI runs" }
