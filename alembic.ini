# Alembic: one migration history for all service schemas (ARCHITECTURE.md §8.2).
# The database URL is not here: migrations/env.py reads DATABASE_URL like the app does.
# Run with `poetry run poe migrate`, create one with `poetry run poe new-migration -m "..."`.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# 20261104_1a2b3c4d5e6f_create_schema_weather.py: files sort in the order they were written.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# New migration files are linted (unused imports removed) and formatted like the rest of the code.
hooks = ruff_check, ruff_format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
