name: Release

# Versions follow Conventional Commits (README → Releases):
#   fix: → 1.4.2 → 1.4.3   feat: → 1.4.0 → 1.5.0   feat!: / BREAKING CHANGE: → 2.0.0
#   Release-As: 2.0.0 in a commit body → exactly that version   chore:, docs:, ci:, ... → no release
#
# 1. Every push to main: release-please opens or updates the release PR ("chore: release
#    1.5.0"), which bumps the versions and writes CHANGELOG.md, and turns on its auto-merge.
# 2. Once its checks pass, the PR merges itself; that push to main makes release-please
#    create the tag v1.5.0 and its GitHub Release. From minor 50 on, you merge it yourself.
# 3. The tag starts publish.yml: build, smoke test, push to GitHub Container Registry.
#
# release-please and the auto-merge use RELEASE_PLEASE_TOKEN, not the job's own token:
# GitHub starts no workflows for PRs, merges and tags made with GITHUB_TOKEN, so the release
# PR would get no CI, its merge would create no tag and the tag would publish no images.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    # One run at a time: two runs must not update the release PR together.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write  # the minor-50 reminder comment
    steps:
      - uses: actions/checkout@v4

      # release-please counts commits from the last release. Until the first one (v1.0.0)
      # exists, there is nothing to count from (README → Releases → First release).
      # Any release will do: right after a release PR is merged, the manifest already holds
      # the new version, whose release is exactly what release-please is about to create.
      - name: First release exists
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(gh release list --limit 1 --json tagName --jq '.[].tagName')" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::There is no GitHub Release yet; create v1.0.0 first (README → Releases → First release)."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Token is configured
        if: steps.current.outputs.released == 'true'
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret RELEASE_PLEASE_TOKEN is missing (README → Releases → One-time setup)."
            exit 1
          fi

      - name: Open or update the release PR, or release it
        id: release
        if: steps.current.outputs.released == 'true'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Release PR version
        id: pr
        if: steps.release.outputs.prs_created == 'true'
        env:
          PR: ${{ steps.release.outputs.pr }}
        run: |
          version=$(jq -r '.title' <<< "$PR" | awk '{print $NF}')
          {
            echo "number=$(jq -r '.number' <<< "$PR")"
            echo "version=$version"
            echo "major=$(cut -d. -f1 <<< "$version")"
            echo "minor=$(cut -d. -f2 <<< "$version")"
          } >> "$GITHUB_OUTPUT"

      # GitHub merges the PR (squash, title as the commit) as soon as the required checks pass.
      # A `chore:` commit, so the merge itself starts no further release. Needs the repository
      # setting "Allow auto-merge" (README → Releases → One-time setup).
      - name: Merge the release PR when its checks pass
        if: steps.pr.outcome == 'success' && fromJSON(steps.pr.outputs.minor) < 50
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Already on from an earlier run: release-please updated the same PR.
          if [ "$(gh pr view "$NUMBER" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge is already on for #$NUMBER."
          else
            gh pr merge "$NUMBER" --auto --squash \
              || { echo "::error::Could not turn on auto-merge. Is 'Allow auto-merge' enabled (README → Releases → One-time setup)?"; exit 1; }
          fi

      # Majors are for breaking changes and milestones, never automatic. From minor 50 on, the
      # release PR waits for you, with a note suggesting to decide about a milestone release.
      - name: Remind about a major release at minor 50
        if: steps.pr.outcome == 'success' && fromJSON(steps.pr.outputs.minor) >= 50
        # Only a hint: if it fails, the release PR is still fine, so the job must not turn red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          VERSION: ${{ steps.pr.outputs.version }}
          MAJOR: ${{ steps.pr.outputs.major }}
        run: |
          marker="<!-- minor-50-reminder -->"
          if ! gh pr view "$NUMBER" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            gh pr comment "$NUMBER" --body "$marker
          **$VERSION**: this is minor release 50 or later, so this PR is not merged automatically. If enough has changed for a milestone, make the next release a major one: add \`Release-As: $(( MAJOR + 1 )).0.0\` to the description of a squash-merged PR. Otherwise merge this PR to release $VERSION."
          fi
