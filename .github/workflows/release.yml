name: Release

# Versions follow Conventional Commits (README → Releases):
#   fix: → 1.4.2 → 1.4.3   feat: → 1.4.0 → 1.5.0   feat!: / BREAKING CHANGE: → 2.0.0
#   Release-As: 2.0.0 in a commit body → exactly that version   chore:, docs:, ci:, ... → no release
#
# 1. Every push to main: release-please opens or updates the release PR ("chore: release
#    1.5.0"), which bumps the versions and writes CHANGELOG.md. Nothing is released yet.
# 2. Merging that PR: release-please creates the tag v1.5.0 and its GitHub Release.
# 3. The tag starts the `images` job: build, smoke test, push to GitHub Container Registry.
#
# release-please uses RELEASE_PLEASE_TOKEN, not the job's own token: GitHub starts no
# workflows for PRs and tags created with GITHUB_TOKEN, so the release PR would get no CI
# (and could never be merged) and the tag would publish no images.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One run at a time: two runs must not update the release PR together.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write  # the minor-50 reminder comment
    steps:
      - uses: actions/checkout@v4

      # release-please counts commits from the last release. Until the first one (v1.0.0)
      # exists, there is nothing to count from (README → Releases → First release).
      - name: Current version is released
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::v$version has no GitHub Release yet; create it first (README → Releases → First release)."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Token is configured
        if: steps.current.outputs.released == 'true'
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret RELEASE_PLEASE_TOKEN is missing (README → Releases → One-time setup)."
            exit 1
          fi

      - name: Open or update the release PR, or release it
        id: release
        if: steps.current.outputs.released == 'true'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Majors are for breaking changes and milestones, never automatic. After many feature
      # releases, a note in the release PR suggests deciding about a milestone release.
      - name: Remind about a major release at minor 50
        if: steps.release.outputs.prs_created == 'true'
        # Only a hint: if it fails, the release PR is still fine, so the job must not turn red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          number=$(jq -r '.number' <<< "$PR")
          version=$(jq -r '.title' <<< "$PR" | awk '{print $NF}')
          minor=$(cut -d. -f2 <<< "$version")
          marker="<!-- minor-50-reminder -->"
          if [ "$minor" -ge 50 ] && ! gh pr view "$number" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            gh pr comment "$number" --body "$marker
          **$version**: this is minor release 50 or later. If enough has changed for a milestone, make the next release a major one: add \`Release-As: $(( $(cut -d. -f1 <<< "$version") + 1 )).0.0\` to the body of a commit (or a squash-merged PR description)."
          fi

  images:
    name: Publish images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GitHub Container Registry with the job's own token
    steps:
      - uses: actions/checkout@v4

      # release-please keeps these in step; a hand-made tag might not.
      - name: Tag matches the versions in the code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          backend=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          frontend=$(python3 -c "import json; print(json.load(open('frontend/package.json'))['version'])")
          echo "tag=$tag pyproject.toml=$backend frontend/package.json=$frontend"
          if [ "$tag" != "$backend" ] || [ "$tag" != "$frontend" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml ($backend) and frontend/package.json ($frontend)."
            exit 1
          fi

      # Registry paths must be lower case; the owner name may not be.
      - name: Image names
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/weather-forecaster" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: API image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.names.outputs.prefix }}-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Web image tags
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.names.outputs.prefix }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Built and loaded locally first: they are pushed only after the smoke test passed.
      # The `:local` tags are the names docker-compose.yml uses.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            weather-forecaster-api:local
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: |
            weather-forecaster-web:local
            ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web

      - name: Start full stack
        run: docker compose --profile full up --detach --no-build --wait --wait-timeout 90

      - name: Smoke test
        run: bash scripts/smoke_test.sh http://localhost:8000 http://localhost:8080

      - name: Container logs
        if: failure()
        run: docker compose --profile full logs

      - name: Shut down
        if: always()
        run: docker compose --profile full down --volumes

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        run: |
          docker push --all-tags "${{ steps.names.outputs.prefix }}-api"
          docker push --all-tags "${{ steps.names.outputs.prefix }}-web"
