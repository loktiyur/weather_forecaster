name: Publish images

# Every release tag (vX.Y.Z, created by release-please in release.yml) publishes both images
# to GitHub Container Registry: tags X.Y.Z, X.Y and latest. Separate from release.yml so each
# run shows only the job it really does.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  images:
    name: Publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GitHub Container Registry with the job's own token
    steps:
      - uses: actions/checkout@v4

      # release-please keeps these in step; a hand-made tag might not.
      - name: Tag matches the versions in the code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          backend=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          frontend=$(python3 -c "import json; print(json.load(open('frontend/package.json'))['version'])")
          echo "tag=$tag pyproject.toml=$backend frontend/package.json=$frontend"
          if [ "$tag" != "$backend" ] || [ "$tag" != "$frontend" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml ($backend) and frontend/package.json ($frontend)."
            exit 1
          fi

      # Registry paths must be lower case; the owner name may not be.
      - name: Image names
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/weather-forecaster" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: API image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.names.outputs.prefix }}-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Web image tags
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.names.outputs.prefix }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Built and loaded locally first: they are pushed only after the smoke test passed.
      # The `:local` tags are the names docker-compose.yml uses.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            weather-forecaster-api:local
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: |
            weather-forecaster-web:local
            ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web

      - name: Start full stack
        run: docker compose --profile full up --detach --no-build --wait --wait-timeout 90

      - name: Smoke test
        run: bash scripts/smoke_test.sh http://localhost:8000 http://localhost:8080

      - name: Container logs
        if: failure()
        run: docker compose --profile full logs

      - name: Shut down
        if: always()
        run: docker compose --profile full down --volumes

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        run: |
          docker push --all-tags "${{ steps.names.outputs.prefix }}-api"
          docker push --all-tags "${{ steps.names.outputs.prefix }}-web"
