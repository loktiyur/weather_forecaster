name: PR title

# With squash merging, the PR title becomes the commit on main, and release-please reads the
# version bump from it. A title it cannot read ("Fix login", "feature: x") would release
# nothing, silently; this check fails such a PR instead. Required check in the ruleset.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # fix → patch release, feat → minor, feat! → major; the others release nothing.
          types: |
            feat
            fix
            perf
            revert
            docs
            test
            ci
            build
            refactor
            style
            chore
